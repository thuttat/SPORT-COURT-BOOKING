$kind: http-request
name: GET MY_BOOKING {{base_url}}/api/my-bookings
url: "{{base_url}}/api/my-bookings"
method: GET
scripts:
  - type: afterResponse
    code: "pm.test(\"Status 200\", () => pm.response.to.have.status(200));\r

      \r

      pm.test(\"Booking có đủ các trường\", () => {\r

      \    const body = pm.response.json();\r

      \    const booking = body.data[0];\r

      \    pm.expect(booking).to.have.property(\"id\");\r

      \    pm.expect(booking).to.have.property(\"field_name\");\r

      \    pm.expect(booking).to.have.property(\"time_slot\");\r

      \    pm.expect(booking).to.have.property(\"booking_date\");\r

      \    pm.expect(booking).to.have.property(\"total_price\");\r

      \    pm.expect(booking).to.have.property(\"status\");\r

      });"
    language: text/javascript
