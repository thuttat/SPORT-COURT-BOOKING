{% extends 'admin/master.html' %}

{% block body %}
{% if current_user.is_authenticated %}
<a href="http://localhost:5173/admin/dashboard" class="btn btn-outline-secondary">
    <i class="fa fa-arrow-left"></i> Go back to Dashboard
</a><h1 class="text-info mt-1">WELCOME TO ADMIN SITE!</h1>
<h2 class="text-success">Hello {{ current_user.fullname }}!</h2>
{% else %}

<div class="text-center mt-5">
    <h2 class="text-danger mb-4">You are not logged in or do not have permission to access!</h2>
    <p class="text-muted mb-4"></p>

    <a href="http://localhost:5173/login" class="btn btn-primary btn-lg px-5" style="border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">Go to the Login page</a>
</div>

{% endif %}

{% endblock %}
