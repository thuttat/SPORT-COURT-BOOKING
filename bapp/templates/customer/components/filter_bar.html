<div>
    <div class="mb-4">
        <h2 class="mb-1">Find Your Court</h2>
        <p class="text-muted">Book your favorite sports court in just a few clicks</p>
    </div>

    <div class="mb-4">
        <div class="mb-3 position-relative">
            <i class="bi bi-search position-absolute top-50 start-0 translate-middle-y ms-3 text-muted"></i>
            <input type="text" id="searchInput" class="form-control ps-5 py-2" placeholder="Search courts...">
        </div>

        <div class="d-flex flex-wrap gap-2 align-items-center">
            <div class="d-flex flex-wrap gap-2" id="sportFilter">
                <button class="btn btn-primary active" data-sport="all">All Sports</button>
                <button class="btn btn-light" data-sport="football">⚽ Football</button>
                <button class="btn btn-light" data-sport="badminton">🏸 Badminton</button>
                <button class="btn btn-light" data-sport="tennis">🎾 Tennis</button>
            </div>

            <div class="ms-auto">
                <input type="date" id="dateInput" class="form-control" value="{{ current_date }}">
            </div>
        </div>
    </div>
</div>
