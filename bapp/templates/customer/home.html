{% extends 'layout/base.html' %}

{% block title %}Home{% endblock %}

{% block content %}
<div class="container py-4">
    {% include 'customer/components/filter_bar.html' %}

    <div class="row g-4">
        {% for court in courts %}
        {% include 'customer/components/court_card.html' %}
        {% endfor %}
    </div>

    <div id="emptyState" class="text-center py-5 d-none">
        <div style="font-size:50px;">🔍</div>
        <h4>No courts found</h4>
        <p class="text-muted">Try adjusting your filters</p>
    </div>

</div>

<script>
    let selectedSport = "all";

    const searchInput = document.getElementById("searchInput");
    const sportButtons = document.querySelectorAll("#sportFilter button");
    const courtItems = document.querySelectorAll(".court-item");
    const emptyState = document.getElementById("emptyState");

    function filterCourts() {
      const search = searchInput.value.toLowerCase();
      let visibleCount = 0;

      courtItems.forEach(item => {
        const name = item.dataset.name;
        const sport = item.dataset.sport;

        const matchSearch = name.includes(search);
        const matchSport = selectedSport === "all" || sport === selectedSport;

        if (matchSearch && matchSport) {
          item.style.display = "";
          visibleCount++;
        } else {
          item.style.display = "none";
        }
      });

      emptyState.classList.toggle("d-none", visibleCount !== 0);
    }

    // Search event
    searchInput.addEventListener("input", filterCourts);

    // Sport filter
    sportButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        sportButtons.forEach(b => b.classList.remove("btn-primary", "active"));
        sportButtons.forEach(b => b.classList.add("btn-light"));

        btn.classList.remove("btn-light");
        btn.classList.add("btn-primary", "active");

        selectedSport = btn.dataset.sport;
        filterCourts();
      });
    });
</script>

{% endblock %}
