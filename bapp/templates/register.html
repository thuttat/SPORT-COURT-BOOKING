<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - Sports Court Booking Web</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/variables.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
<div class="min-vh-100 d-flex align-items-center justify-content-center p-4"
     style="background: linear-gradient(135deg, rgba(184,212,241,0.2), rgba(184,230,213,0.2), rgba(212,184,230,0.2));">

  <div class="w-100" style="max-width: 420px;">
    <div class="card shadow-lg border-0 rounded-4 p-4">

      <div class="text-center mb-4">
        <div class="d-flex align-items-center justify-content-center mx-auto mb-3"
             style="width:64px;height:64px;background:#34D399;border-radius:16px;">
          <i class="bi bi bi-person-plus text-white fs-3"></i>
        </div>
        <h3 class="mb-1">Create Account</h3>
        <p class="text-muted">Join us to start booking</p>
      </div>

      <form>
          <div class="mb-3">
          <label class="form-label">Full Name</label>
          <input type="text" class="form-control" placeholder="Enter your full name..." required>
        </div>

        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" placeholder="you@example.com" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" placeholder="Create a password" required>
        </div>

        <button class="btn btn-primary w-100">Sign Up</button>
      </form>

      <div class="text-center mt-4">
        <p class="text-muted mb-0">
          Already have an account?
          <a href="/login" class="text-primary text-decoration-none">Sign in</a>
        </p>
      </div>
    </div>
  </div>
</div>
</body>
</html>
